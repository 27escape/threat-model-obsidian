name: Web app

# Builds the web app (one self-contained page, dist/web/index.html) and publishes it on GitHub Pages, at
# https://<owner>.github.io/<repo>/. Runs for each release tag, so the page matches the released plugin, and can be
# run by hand from the Actions tab. Needs Pages switched on once: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pele and the Lucide icons, at the versions the page is tested with
        run: npm install --no-save pele@1.13.0 lucide-static@1.77.0
      - name: Build
        run: |
          node tools/build.mjs
          node tools/build-web.mjs
      - name: Tests and checks
        run: |
          node --test test/*.test.mjs
          node tools/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
